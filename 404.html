<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">

  <title>404 — Space Chi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg: #050505;
      --surface: #0d0d0d;
      --border: #292929;
      --border-light: #3a3a3a;
      --text: #f0f0f0;
      --muted: #777;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at 50% 25%,
          #171717 0,
          transparent 35%
        ),
        var(--bg);

      color: var(--text);

      font-family: Vazirmatn, sans-serif;
    }

    .page {
      width: min(620px, 100%);
      text-align: center;
    }

    .logo {
      width: 58px;
      height: 58px;

      margin: 0 auto 25px;

      border: 1px solid var(--border);
      border-radius: 16px;

      overflow: hidden;

      background: var(--surface);
    }

    .logo img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    .illustration {
      position: relative;

      width: min(360px, 90vw);
      height: 220px;

      margin: 0 auto 18px;
    }

    .planet {
      position: absolute;

      width: 130px;
      height: 130px;

      left: 50%;
      top: 40px;

      transform: translateX(-50%);

      border: 1px solid #454545;
      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #292929,
          #111 65%
        );

      box-shadow:
        0 0 0 15px rgba(255,255,255,.015),
        0 0 70px rgba(255,255,255,.03);
    }

    .planet::before,
    .planet::after {
      content: "";

      position: absolute;

      border: 1px solid #303030;
      border-radius: 50%;
    }

    .planet::before {
      width: 55px;
      height: 14px;

      left: 36px;
      top: 38px;

      transform: rotate(-18deg);
    }

    .planet::after {
      width: 35px;
      height: 9px;

      left: 55px;
      top: 72px;

      transform: rotate(20deg);
    }

    .orbit {
      position: absolute;

      width: 240px;
      height: 75px;

      left: 50%;
      top: 65px;

      transform:
        translateX(-50%)
        rotate(-15deg);

      border: 1px solid #303030;
      border-radius: 50%;
    }

    .orbit.two {
      width: 300px;
      height: 105px;

      transform:
        translateX(-50%)
        rotate(20deg);
    }

    .star {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: #aaa;
    }

    .s1 { left: 35px; top: 38px; }
    .s2 { right: 45px; top: 20px; }
    .s3 { left: 68px; bottom: 35px; }
    .s4 { right: 25px; bottom: 45px; }
    .s5 { left: 105px; top: 10px; }
    .s6 { right: 90px; bottom: 15px; }

    .code {
      color: #666;
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 3px;
    }

    h1 {
      margin: 0;

      font-size: clamp(54px, 15vw, 100px);

      line-height: .9;

      letter-spacing: -5px;
    }

    h2 {
      margin: 20px 0 8px;

      font-size: 20px;
    }

    p {
      margin: 0 auto 25px;

      max-width: 430px;

      color: var(--muted);

      font-size: 13px;
      line-height: 2;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .button {
      min-height: 43px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 0 18px;

      border-radius: 10px;

      text-decoration: none;

      transition: .18s ease;
    }

    .button svg {
      width: 17px;
      height: 17px;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .button.primary {
      background: white;
      color: black;

      border: 1px solid white;
    }

    .button.primary:hover {
      background: #ddd;
    }

    .button.secondary {
      background: var(--surface);
      color: var(--text-2);

      border: 1px solid var(--border);
    }

    .button.secondary:hover {
      color: white;
      border-color: var(--border-light);
    }

    @media (max-width: 500px) {

      body {
        padding: 18px;
      }

      .illustration {
        height: 190px;
      }

      .planet {
        width: 110px;
        height: 110px;
      }

      .orbit {
        width: 210px;
      }

      .orbit.two {
        width: 260px;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }

    }

  </style>
</head>

<body>

  <main class="page">

    <div class="logo">
      <img
        src="https://cdn.imgurl.ir/uploads/j9346_InShot_20260930_141619549.png"
        alt="Space Chi"
      >
    </div>


    <div class="illustration">

      <span class="star s1"></span>
      <span class="star s2"></span>
      <span class="star s3"></span>
      <span class="star s4"></span>
      <span class="star s5"></span>
      <span class="star s6"></span>

      <div class="orbit"></div>
      <div class="orbit two"></div>

      <div class="planet"></div>

    </div>


    <div class="code">
      SPACE / LOST / 404
    </div>

    <h1>404</h1>

    <h2>این فضا پیدا نشد</h2>

    <p>
      به نظر میاد مسیری که دنبالشی وجود نداره،
      حذف شده یا آدرسش اشتباهه.
    </p>


    <div class="actions">

      <a href="./" class="button primary">

        <svg viewBox="0 0 24 24">
          <path d="m4 11 8-7 8 7"/>
          <path d="M6.5 10v9h11v-9"/>
          <path d="M10 19v-5h4v5"/>
        </svg>

        برگشت به Space Chi

      </a>


      <button
        class="button secondary"
        onclick="history.back()"
      >

        <svg viewBox="0 0 24 24">
          <path d="M19 12H5"/>
          <path d="m11 6-6 6 6 6"/>
        </svg>

        صفحه قبل

      </button>

    </div>

  </main>

</body>
</html>
