<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050606">
  <title>404 / SPACE_NOT_FOUND</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css">
</head>
<body class="not-found-page">
  <main class="not-found">
    <section class="terminal" aria-label="Terminal error">
      <div class="terminal-bar"><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-title">plan-space://router</span></div>
      <div class="terminal-body">
        <div class="term-dim">Plan Space request monitor</div>
        <p class="term-prompt">GET <span id="path">/unknown-space</span></p>
        <p><span class="term-dim">status:</span> <span class="term-error">404</span></p>
        <p><span class="term-dim">error:</span> <span class="term-error">SPACE_NOT_FOUND</span></p>
        <p class="term-dim">The requested workspace route does not exist in this deployment.</p>
        <p class="term-green">recovery: route → plan-space<span class="cursor"></span></p>
        <div class="term-actions">
          <button class="term-btn" id="homeBtn">$ cd /plan-space</button>
          <button class="term-btn" id="backBtn">$ history.back()</button>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
