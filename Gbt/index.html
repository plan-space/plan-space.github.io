<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Space Chi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="https://cdn.imgurl.ir/uploads/j9346_InShot_20260930_141619549.png" alt="Space Chi">
      <span>Space Chi</span>
    </div>

    <div class="tabs" id="tabs"></div>

    <button class="icon-btn desktop-add" id="newSpaceBtn" title="اسپیس جدید">+</button>
    <button class="icon-btn mobile-more" id="mobileMoreBtn" title="منو">⋯</button>
  </header>

  <main id="app">
    <section class="workspace-head">
      <div>
        <div class="eyebrow">SPACE</div>
        <h1 id="spaceTitle">My Space</h1>
        <p id="spaceMeta">فضای شخصی تو</p>
      </div>
      <div class="head-actions">
        <button class="ghost-btn" id="searchBtn">⌕ <span>جست‌وجو</span></button>
        <button class="primary-btn" id="addBoxBtn">+ افزودن باکس</button>
      </div>
    </section>

    <section class="canvas-wrap">
      <div class="canvas-toolbar">
        <div class="toolbar-left">
          <button class="tool-btn active" data-view="grid">▦</button>
          <button class="tool-btn" data-view="list">☷</button>
          <span class="toolbar-separator"></span>
          <button class="tool-btn" id="expandFolders">باز کردن پوشه‌ها</button>
        </div>
        <div class="toolbar-right">
          <span id="boxCount">0 باکس</span>
        </div>
      </div>
      <div id="board" class="board grid-view"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="bottom-item active" data-action="spaces"><span>⌂</span><small>اسپیس‌ها</small></button>
    <button class="bottom-item" data-action="add"><span>＋</span><small>باکس</small></button>
    <button class="bottom-item" data-action="search"><span>⌕</span><small>جست‌وجو</small></button>
    <button class="bottom-item" data-action="settings"><span>⚙</span><small>تنظیمات</small></button>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
