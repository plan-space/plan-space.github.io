<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Chi</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ─────────────────────────────────────────
       SPACE CHI — Modern Monochrome Theme
    ───────────────────────────────────────── */
    :root {
      --bg: #050505;
      --surface: #0f0f0f;
      --surface2: #1a1a1a;
      --surface3: #252525;
      --border: #2a2a2a;
      --border2: #404040;
      --text: #ffffff;
      --text2: #a0a0a0;
      --text3: #606060;
      --accent: #ffffff;
      --accent-dim: rgba(255, 255, 255, 0.08);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --shadow: 0 8px 32px rgba(0,0,0,0.6);
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.4);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Vazirmatn', 'Inter', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      padding-bottom: 90px; /* Space for mobile nav */
    }

    @media (min-width: 769px) { body { padding-bottom: 0; } }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

    /* ── HEADER & TABS ── */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: rgba(5, 5, 5, 0.85);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }

    .logo img {
      width: 32px; height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--border2);
    }

    .tab-bar {
      display: flex;
      gap: 4px;
      flex: 1;
      overflow-x: auto;
      scrollbar-width: none;
      padding-top: 8px;
    }
    .tab-bar::-webkit-scrollbar { display: none; }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      color: var(--text2);
      font-size: 13px;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }

    .tab:hover { background: var(--surface3); color: var(--text); }
    .tab.active {
      background: var(--bg);
      color: var(--text);
      border-color: var(--border2);
      border-bottom: 1px solid var(--bg);
      margin-bottom: -1px;
      z-index: 10;
    }

    .tab.add-tab {
      background: transparent;
      border: 1px dashed var(--border2);
      border-bottom: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 0;
    }
    .tab.add-tab:hover { border-color: var(--text3); color: var(--text); }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 36px; height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }
    .icon-btn:hover { background: var(--surface3); color: var(--text); border-color: var(--border2); }

    /* ── MAIN CONTENT ── */
    .app-main {
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px;
      width: 100%;
    }

    .space-content { display: none; animation: fadeIn 0.3s ease; }
    .space-content.active { display: block; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    /* ── BOX STYLES ── */
    .box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      transition: all var(--transition);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .box:hover {
      border-color: var(--border2);
      box-shadow: var(--shadow-sm);
      transform: translateY(-2px);
    }

    .box.folder-box {
      background: linear-gradient(135deg, var(--surface2) 0%, var(--surface) 100%);
      border: 1px dashed var(--border2);
    }

    .box-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .box-type-icon {
      width: 32px; height: 32px;
      border-radius: var(--radius-sm);
      background: var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-size: 14px;
      flex-shrink: 0;
    }

    .box-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .box-actions { display: flex; gap: 4px; }

    .box-action-btn {
      width: 24px; height: 24px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--text3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      transition: all var(--transition);
    }
    .box-action-btn:hover { background: var(--surface3); color: var(--text); }

    /* Note Box */
    .rich-toolbar {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .rich-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text3);
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
      transition: all var(--transition);
    }
    .rich-btn:hover { background: var(--surface3); color: var(--text); }

    .note-content {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text2);
      outline: none;
      min-height: 60px;
    }
    .note-content b { color: var(--text); }
    .note-content a { color: var(--text); text-decoration: underline; }
    .note-content table {
      width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px;
    }
    .note-content td {
      border: 1px solid var(--border2); padding: 6px; color: var(--text2);
    }

    /* Task Box */
    .task-list { list-style: none; }
    .task-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .task-item:last-child { border-bottom: none; }
    .task-item input[type="checkbox"] {
      accent-color: var(--text);
      width: 16px; height: 16px;
      cursor: pointer;
    }
    .task-item span {
      color: var(--text2);
      font-size: 14px;
      flex: 1;
    }
    .task-item.completed span {
      text-decoration: line-through;
      color: var(--text3);
    }
    .add-task-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px dashed var(--border2);
      color: var(--text);
      padding: 8px 0;
      font-family: var(--font);
      font-size: 14px;
      outline: none;
    }
    .add-task-input::placeholder { color: var(--text3); }

    /* Link Box */
    .link-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--surface2);
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text);
      transition: all var(--transition);
    }
    .link-box:hover { background: var(--surface3); }
    .link-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }
    .link-info { flex: 1; overflow: hidden; }
    .link-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .link-url { font-size: 12px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Folder Stats */
    .folder-stats {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--text3);
    }
    .folder-stat { display: flex; align-items: center; gap: 4px; }

    /* Folder Connection Tag */
    .folder-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      background: var(--surface3);
      color: var(--text2);
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-top: 12px;
      width: fit-content;
    }

    /* ── MOBILE FLOATING NAV ── */
    .mobile-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 15, 15, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border2);
      border-radius: 20px;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      z-index: 1000;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--text3);
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font);
      font-size: 10px;
    }
    .nav-btn i { font-size: 18px; margin-bottom: 2px; }
    .nav-btn:hover { color: var(--text2); background: var(--accent-dim); }
    .nav-btn.active { color: var(--text); background: var(--surface3); }

    .nav-btn.add-btn {
      background: var(--text);
      color: var(--bg);
      width: 48px; height: 48px;
      border-radius: 50%;
      padding: 0;
      margin-top: -20px;
      box-shadow: 0 4px 16px rgba(255,255,255,0.15);
    }
    .nav-btn.add-btn i { font-size: 20px; margin: 0; }
    .nav-btn.add-btn:hover { transform: scale(1.05); }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow);
      animation: modalIn 0.2s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 { font-size: 16px; font-weight: 600; }
    .close-modal {
      background: none; border: none; color: var(--text3);
      cursor: pointer; font-size: 16px; padding: 4px;
    }
    .close-modal:hover { color: var(--text); }

    .modal-body { padding: 20px; }

    .box-type-selector {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .type-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text2);
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font);
      font-size: 13px;
    }
    .type-btn i { font-size: 20px; }
    .type-btn:hover { border-color: var(--border2); background: var(--surface3); color: var(--text); }
    .type-btn.selected { border-color: var(--text); background: var(--accent-dim); color: var(--text); }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text3);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      transition: border-color var(--transition);
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--text3); }
    .form-group select option { background: var(--surface2); color: var(--text); }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }
    .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }

    /* ── RESPONSIVE ── */
    .desktop-only { display: flex; }
    .mobile-only { display: none; }

    @media (max-width: 768px) {
      .desktop-only { display: none !important; }
      .mobile-only { display: flex; }
      .header-inner { padding: 0 16px; }
      .grid-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <a href="#" class="logo">
        <img src="https://cdn.imgurl.ir/uploads/j9346_InShot_20260930_141619549.png" alt="Space Chi Logo">
        <span>Space Chi</span>
      </a>
      
      <div class="tab-bar desktop-only">
        <div class="tab active" data-space="main">
          <i class="fas fa-layer-group"></i>
          <span>فضای اصلی</span>
        </div>
        <div class="tab" data-space="projects">
          <i class="fas fa-folder-open"></i>
          <span>پروژه‌ها</span>
        </div>
        <div class="tab add-tab" onclick="alert('ایجاد فضای جدید')">
          <i class="fas fa-plus"></i>
        </div>
      </div>

      <div class="desktop-nav desktop-only">
        <button class="icon-btn" id="add-box-btn" title="افزودن باکس">
          <i class="fas fa-plus"></i>
        </button>
        <button class="icon-btn" title="تنظیمات">
          <i class="fas fa-cog"></i>
        </button>
      </div>

      <button class="icon-btn mobile-only" style="margin-right: auto;">
        <i class="fas fa-ellipsis-v"></i>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="app-main">
    <div class="space-content active" id="space-main">
      <div class="grid-container" id="box-grid-main"></div>
    </div>
    <div class="space-content" id="space-projects">
      <div class="grid-container" id="box-grid-projects"></div>
    </div>
  </main>

  <!-- Mobile Floating Navbar -->
  <nav class="mobile-nav mobile-only">
    <button class="nav-btn active" onclick="switchSpace('main')">
      <i class="fas fa-home"></i>
      <span>خانه</span>
    </button>
    <button class="nav-btn" onclick="switchSpace('projects')">
      <i class="fas fa-folder"></i>
      <span>پوشه‌ها</span>
    </button>
    <button class="nav-btn add-btn" id="mobile-add-btn">
      <i class="fas fa-plus"></i>
    </button>
    <button class="nav-btn">
      <i class="fas fa-project-diagram"></i>
      <span>نمودار</span>
    </button>
    <button class="nav-btn">
      <i class="fas fa-cog"></i>
      <span>تنظیمات</span>
    </button>
  </nav>

  <!-- Add Box Modal -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>افزودن باکس جدید</h3>
        <button class="close-modal"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div class="box-type-selector">
          <button class="type-btn selected" data-type="note">
            <i class="fas fa-sticky-note"></i>
            <span>یادداشت</span>
          </button>
          <button class="type-btn" data-type="task">
            <i class="fas fa-check-circle"></i>
            <span>تسک</span>
          </button>
          <button class="type-btn" data-type="link">
            <i class="fas fa-link"></i>
            <span>لینک</span>
          </button>
          <button class="type-btn" data-type="folder">
            <i class="fas fa-folder"></i>
            <span>پوشه</span>
          </button>
        </div>
        
        <div class="form-group">
          <label>عنوان</label>
          <input type="text" id="box-title" placeholder="عنوان باکس...">
        </div>

        <div class="form-group">
          <label>اتصال به پوشه (نمودار)</label>
          <select id="box-folder">
            <option value="">بدون پوشه</option>
            <option value="پوشه ایده‌ها">پوشه ایده‌ها</option>
            <option value="پروژه اصلی">پروژه اصلی</option>
          </select>
        </div>

        <button class="submit-btn" id="create-box-btn">ایجاد باکس</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let currentSpace = 'main';
      let selectedBoxType = 'note';
      
      // داده‌های نمونه اولیه
      let boxes = [
        { id: 1, type: 'folder', title: 'پوشه ایده‌ها', space: 'main', folder: null, itemCount: 3 },
        { id: 2, type: 'note', title: 'یادداشت سریع', space: 'main', folder: 'پوشه ایده‌ها', content: 'این یک <b>یادداشت</b> نمونه است.' },
        { id: 3, type: 'task', title: 'کارهای امروز', space: 'main', folder: null, tasks: [{text: 'طراحی رابط کاربری', done: true}, {text: 'بررسی کدها', done: false}] },
        { id: 4, type: 'link', title: 'مستندات Space Chi', space: 'main', folder: 'پروژه اصلی', url: 'https://example.com' }
      ];

      const tabs = document.querySelectorAll('.tab:not(.add-tab)');
      const modal = document.getElementById('add-modal');
      const addBtns = [document.getElementById('add-box-btn'), document.getElementById('mobile-add-btn')];
      const closeBtn = document.querySelector('.close-modal');
      const typeBtns = document.querySelectorAll('.type-btn');
      const createBtn = document.getElementById('create-box-btn');

      // تعویض تب‌ها
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          switchSpace(tab.dataset.space);
        });
      });

      window.switchSpace = (spaceId) => {
        currentSpace = spaceId;
        tabs.forEach(t => t.classList.toggle('active', t.dataset.space === spaceId));
        document.querySelectorAll('.space-content').forEach(s => s.classList.remove('active'));
        document.getElementById(`space-${spaceId}`).classList.add('active');
        
        document.querySelectorAll('.mobile-nav .nav-btn:not(.add-btn)').forEach((btn, index) => {
          btn.classList.toggle('active', (index === 0 && spaceId === 'main') || (index === 1 && spaceId === 'projects'));
        });
        renderBoxes();
      };

      // مدیریت مودال
      addBtns.forEach(btn => {
        if(btn) btn.addEventListener('click', () => {
          modal.classList.add('open');
          selectType('note');
        });
      });

      closeBtn.addEventListener('click', () => modal.classList.remove('open'));
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

      typeBtns.forEach(btn => {
        btn.addEventListener('click', () => selectType(btn.dataset.type));
      });

      function selectType(type) {
        selectedBoxType = type;
        typeBtns.forEach(b => b.classList.toggle('selected', b.dataset.type === type));
      }

      // ایجاد باکس جدید
      createBtn.addEventListener('click', () => {
        const title = document.getElementById('box-title').value || 'بدون عنوان';
        const folder = document.getElementById('box-folder').value;
        
        const newBox = {
          id: Date.now(),
          type: selectedBoxType,
          title: title,
          space: currentSpace,
          folder: folder || null,
          content: selectedBoxType === 'note' ? 'اینجا بنویسید...' : '',
          tasks: selectedBoxType === 'task' ? [{text: 'تسک جدید', done: false}] : [],
          url: selectedBoxType === 'link' ? 'https://' : '',
          itemCount: selectedBoxType === 'folder' ? 0 : undefined
        };
        
        boxes.push(newBox);
        modal.classList.remove('open');
        document.getElementById('box-title').value = '';
        renderBoxes();
      });

      // رندر کردن باکس‌ها
      function renderBoxes() {
        const grid = document.getElementById(`box-grid-${currentSpace}`);
        grid.innerHTML = '';
        
        const spaceBoxes = boxes.filter(b => b.space === currentSpace);
        
        spaceBoxes.forEach(box => {
          const el = document.createElement('div');
          el.className = `box ${box.type === 'folder' ? 'folder-box' : ''}`;
          
          let icon = 'fa-sticky-note';
          if (box.type === 'task') icon = 'fa-check-circle';
          if (box.type === 'link') icon = 'fa-link';
          if (box.type === 'folder') icon = 'fa-folder';
          
          let contentHtml = '';
          
          if (box.type === 'note') {
            contentHtml = `
              <div class="rich-toolbar">
                <button class="rich-btn" onclick="formatDoc('bold')"><i class="fas fa-bold"></i></button>
                <button class="rich-btn" onclick="formatDoc('italic')"><i class="fas fa-italic"></i></button>
                <button class="rich-btn" onclick="formatDoc('insertUnorderedList')"><i class="fas fa-list-ul"></i></button>
                <button class="rich-btn" onclick="insertTable()"><i class="fas fa-table"></i></button>
                <button class="rich-btn" onclick="addLink()"><i class="fas fa-link"></i></button>
              </div>
              <div class="note-content" contenteditable="true" onblur="updateNote(${box.id}, this.innerHTML)">${box.content}</div>
            `;
          } else if (box.type === 'task') {
            const tasksHtml = box.tasks.map((t, i) => `
              <li class="task-item ${t.done ? 'completed' : ''}">
                <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${box.id}, ${i})">
                <span>${t.text}</span>
              </li>
            `).join('');
            contentHtml = `
              <ul class="task-list">${tasksHtml}</ul>
              <input type="text" class="add-task-input" placeholder="+ افزودن تسک جدید" onkeydown="addTask(event, ${box.id})">
            `;
          } else if (box.type === 'link') {
            contentHtml = `
              <a href="${box.url}" target="_blank" class="link-box">
                <div class="link-icon"><i class="fas fa-globe"></i></div>
                <div class="link-info">
                  <div class="link-title">${box.title}</div>
                  <div class="link-url">${box.url}</div>
                </div>
              </a>
            `;
          } else if (box.type === 'folder') {
            contentHtml = `
              <div class="folder-stats">
                <div class="folder-stat"><i class="fas fa-file"></i> ${box.itemCount} آیتم متصل</div>
                <div class="folder-stat"><i class="fas fa-clock"></i> به‌روزرسانی شد</div>
              </div>
            `;
          }
          
          const folderTag = box.folder ? `<div class="folder-tag"><i class="fas fa-project-diagram"></i> متصل به: ${box.folder}</div>` : '';
          
          el.innerHTML = `
            <div class="box-header">
              <div class="box-type-icon"><i class="fas ${icon}"></i></div>
              <div class="box-actions">
                <button class="box-action-btn" onclick="deleteBox(${box.id})"><i class="fas fa-trash"></i></button>
              </div>
            </div>
            <div class="box-title">${box.title}</div>
            <div class="box-content">${contentHtml}</div>
            ${folderTag}
          `;
          
          grid.appendChild(el);
        });
      }

      // توابع سراسری برای ویرایشگر Rich Text
      window.formatDoc = (cmd, value = null) => {
        document.execCommand(cmd, false, value);
      };
      
      window.addLink = () => {
        const url = prompt('آدرس لینک را وارد کنید:');
        if (url) document.execCommand('createLink', false, url);
      };

      window.insertTable = () => {
        const tableHtml = '<table><tr><td>سلول ۱</td><td>سلول ۲</td></tr><tr><td>سلول ۳</td><td>سلول ۴</td></tr></table><br>';
        document.execCommand('insertHTML', false, tableHtml);
      };
      
      window.updateNote = (id, content) => {
        const box = boxes.find(b => b.id === id);
        if (box) box.content = content;
      };
      
      window.toggleTask = (boxId, taskIndex) => {
        const box = boxes.find(b => b.id === boxId);
        if (box) {
          box.tasks[taskIndex].done = !box.tasks[taskIndex].done;
          renderBoxes();
        }
      };
      
      window.addTask = (e, boxId) => {
        if (e.key === 'Enter' && e.target.value.trim()) {
          const box = boxes.find(b => b.id === boxId);
          if (box) {
            box.tasks.push({ text: e.target.value.trim(), done: false });
            renderBoxes();
          }
        }
      };
      
      window.deleteBox = (id) => {
        if (confirm('آیا از حذف این باکس اطمینان دارید؟')) {
          boxes = boxes.filter(b => b.id !== id);
          renderBoxes();
        }
      };

      renderBoxes();
    });
  </script>
</body>
</html>
