<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="Plan Space — فضای برنامه‌ریزی، سازمان‌دهی ایده‌ها و ساخت نمودار" />
  <title>Plan Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#workspace">رفتن به فضای کار</a>

  <header class="app-header" id="app-header">
    <div class="header-left">
      <div class="brand" aria-label="Plan Space">
        <img
          class="brand-logo"
          src="https://cdn.imgurl.ir/uploads/e9468_InShot_20260930_203439477.png"
          alt=""
          width="32"
          height="32"
        />
        <span class="brand-name">Plan Space</span>
      </div>
      <nav class="space-tabs" id="space-tabs" aria-label="اسپیس‌ها"></nav>
      <button type="button" class="icon-btn" id="btn-add-space" aria-label="اسپیس جدید">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
      </button>
    </div>
    <div class="header-right">
      <div class="search-wrap" id="search-wrap">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input type="search" id="search-input" placeholder="جستجو در اسپیس…" autocomplete="off" aria-label="جستجو" />
      </div>
      <button type="button" class="icon-btn" id="btn-theme" aria-label="تغییر تم">
        <i class="fa-solid fa-moon" aria-hidden="true"></i>
      </button>
      <button type="button" class="icon-btn" id="btn-fullscreen" aria-label="تمام‌صفحه">
        <i class="fa-solid fa-expand" aria-hidden="true"></i>
      </button>
      <button type="button" class="icon-btn" id="btn-export" aria-label="خروجی JSON">
        <i class="fa-solid fa-file-export" aria-hidden="true"></i>
      </button>
      <button type="button" class="icon-btn" id="btn-import" aria-label="ورود JSON">
        <i class="fa-solid fa-file-import" aria-hidden="true"></i>
      </button>
      <button type="button" class="icon-btn header-more" id="btn-space-menu" aria-label="منوی اسپیس">
        <i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <div class="canvas-scroll" id="canvas-scroll">
      <div class="canvas" id="canvas">
        <div class="canvas-dots" aria-hidden="true"></div>
        <svg class="connections" id="connections" aria-hidden="true"></svg>
        <div class="boxes-layer" id="boxes-layer"></div>
        <div class="empty-state" id="empty-state" hidden>
          <div class="empty-inner">
            <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
            <h2>فضای خالی</h2>
            <p>اولین باکس را بساز تا نقشه‌ات شکل بگیرد.</p>
            <button type="button" class="btn-primary" id="btn-empty-add">
              <i class="fa-solid fa-plus" aria-hidden="true"></i>
              افزودن باکس
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <nav class="mobile-toolbar" id="mobile-toolbar" aria-label="نوار موبایل">
    <button type="button" class="icon-btn" id="m-add" aria-label="افزودن باکس">
      <i class="fa-solid fa-plus" aria-hidden="true"></i>
    </button>
    <button type="button" class="icon-btn" id="m-search" aria-label="جستجو">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
    </button>
    <button type="button" class="icon-btn" id="m-theme" aria-label="تم">
      <i class="fa-solid fa-moon" aria-hidden="true"></i>
    </button>
    <button type="button" class="icon-btn" id="m-export" aria-label="خروجی">
      <i class="fa-solid fa-file-export" aria-hidden="true"></i>
    </button>
    <button type="button" class="icon-btn" id="m-import" aria-label="ورود">
      <i class="fa-solid fa-file-import" aria-hidden="true"></i>
    </button>
  </nav>

  <button type="button" class="fab" id="fab-add" aria-label="افزودن باکس">
    <i class="fa-solid fa-plus" aria-hidden="true"></i>
  </button>

  <div class="modal-root" id="modal-root" hidden></div>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden />

  <script src="script.js"></script>
</body>
</html>
