<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="description" content="Plan Space — a visual workspace for ideas, tasks, links, folders and charts.">
  <title>Plan Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" id="appHeader">
    <div class="brand">
      <img class="brand-logo" src="https://cdn.imgurl.ir/uploads/e9468_InShot_20260930_203439477.png" alt="Plan Space logo">
      <span>Plan Space</span>
    </div>
    <div class="space-tabs-wrap">
      <nav class="space-tabs" id="spaceTabs" aria-label="Spaces"></nav>
      <button class="icon-btn tab-add" data-action="new-space" aria-label="Create space" title="Create space"><i class="fa-solid fa-plus"></i></button>
    </div>
    <div class="header-actions">
      <label class="search-box" aria-label="Search current space">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="searchInput" type="search" placeholder="Search" autocomplete="off">
        <kbd>⌘K</kbd>
      </label>
      <button class="icon-btn" data-action="theme" aria-label="Toggle theme" title="Toggle theme"><i class="fa-solid fa-moon"></i></button>
      <button class="icon-btn" data-action="import" aria-label="Import workspace" title="Import"><i class="fa-solid fa-file-arrow-up"></i></button>
      <button class="icon-btn" data-action="export" aria-label="Export workspace" title="Export"><i class="fa-solid fa-file-arrow-down"></i></button>
      <button class="icon-btn" data-action="fullscreen" aria-label="Toggle fullscreen" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
    </div>
  </header>

  <main class="app-main">
    <section class="workspace" id="workspace" aria-label="Plan Space workspace">
      <div class="canvas-surface" id="canvasSurface">
        <svg class="canvas-connections" id="connections" aria-hidden="true"></svg>
        <div class="canvas-box-layer" id="boxLayer"></div>
        <div class="empty-state" id="emptyState">
          <div class="empty-icon"><i class="fa-regular fa-compass"></i></div>
          <h1>Start shaping your space</h1>
          <p>Add a box, move it anywhere, and build your own visual workspace.</p>
          <button class="primary-btn" data-action="add-box"><i class="fa-solid fa-plus"></i> Add your first box</button>
        </div>
      </div>
    </section>
  </main>

  <div class="desktop-fab" id="desktopFab">
    <button class="fab-btn" data-action="add-box" aria-label="Add box" title="Add box"><i class="fa-solid fa-plus"></i></button>
  </div>

  <nav class="mobile-toolbar" aria-label="Workspace actions">
    <button data-action="add-box"><i class="fa-solid fa-plus"></i><span>Add</span></button>
    <button data-action="search-focus"><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></button>
    <button data-action="theme"><i class="fa-solid fa-circle-half-stroke"></i><span>Theme</span></button>
    <button data-action="more"><i class="fa-solid fa-ellipsis"></i><span>More</span></button>
  </nav>

  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="toast-root" id="toastRoot" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="script.js" defer></script>
</body>
</html>
