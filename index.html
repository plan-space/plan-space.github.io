<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#050505">
  <meta name="description" content="Space Chi — فضای شخصی برای ساخت، سازمان‌دهی و مدیریت ایده‌ها">

  <title>Space Chi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Vazirmatn:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       APP
  ========================== -->

  <div class="app">


    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

      <div class="brand">

        <div class="brand-mark">
          <i class="fa-solid fa-layer-group"></i>
        </div>

        <div class="brand-text">
          <strong>Space Chi</strong>
          <span>your digital space</span>
        </div>

      </div>


      <!-- Spaces / Browser Tabs -->

      <div class="spaces" id="spaces">

        <!-- generated by JS -->

      </div>


      <div class="top-actions">

        <button
          class="icon-btn"
          id="searchBtn"
          title="جستجو"
        >
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        <button
          class="icon-btn"
          id="exportBtn"
          title="خروجی"
        >
          <i class="fa-solid fa-download"></i>
        </button>

        <button
          class="icon-btn"
          id="importBtn"
          title="ورودی"
        >
          <i class="fa-solid fa-upload"></i>
        </button>

        <button
          class="icon-btn"
          id="addSpaceBtn"
          title="Space جدید"
        >
          <i class="fa-solid fa-plus"></i>
        </button>

        <input
          type="file"
          id="importFile"
          accept=".json"
          hidden
        >

      </div>

    </header>



    <!-- =========================
         SEARCH PANEL
    ========================== -->

    <div class="search-panel" id="searchPanel">

      <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
          id="searchInput"
          type="search"
          placeholder="توی این فضا بگرد..."
          autocomplete="off"
        >

        <button id="closeSearch">
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>

    </div>



    <!-- =========================
         WORKSPACE
    ========================== -->

    <main class="workspace">


      <!-- Breadcrumb -->

      <div class="workspace-head">

        <div class="breadcrumb" id="breadcrumb">

          <!-- generated by JS -->

        </div>


        <div class="workspace-actions">

          <button
            class="small-btn"
            id="sortBtn"
          >
            <i class="fa-solid fa-arrow-down-a-z"></i>
            مرتب‌سازی
          </button>

          <button
            class="small-btn primary"
            id="newBoxBtn"
          >
            <i class="fa-solid fa-plus"></i>
            ساختن
          </button>

        </div>

      </div>



      <!-- Filters -->

      <div class="filters">

        <button
          class="filter active"
          data-filter="all"
        >
          همه
        </button>

        <button
          class="filter"
          data-filter="note"
        >
          <i class="fa-regular fa-note-sticky"></i>
          یادداشت
        </button>

        <button
          class="filter"
          data-filter="task"
        >
          <i class="fa-regular fa-square-check"></i>
          کار
        </button>

        <button
          class="filter"
          data-filter="link"
        >
          <i class="fa-solid fa-link"></i>
          لینک
        </button>

        <button
          class="filter"
          data-filter="folder"
        >
          <i class="fa-regular fa-folder"></i>
          پوشه
        </button>

      </div>



      <!-- Boxes -->

      <section
        class="boxes"
        id="boxes"
      >

        <!-- generated by JS -->

      </section>



      <!-- Empty -->

      <section
        class="empty"
        id="emptyState"
        hidden
      >

        <div class="empty-icon">
          <i class="fa-regular fa-folder-open"></i>
        </div>

        <h2>این فضا خالیه</h2>

        <p>
          اولین باکس رو بساز و فضای خودت رو شکل بده.
        </p>

        <button
          class="small-btn primary"
          id="emptyAddBtn"
        >
          <i class="fa-solid fa-plus"></i>
          ساخت اولین باکس
        </button>

      </section>


    </main>



    <!-- =========================
         MOBILE NAV
    ========================== -->

    <nav class="mobile-nav">

      <button
        data-mobile="home"
        class="mobile-nav-item active"
      >
        <i class="fa-solid fa-house"></i>
        <span>خانه</span>
      </button>

      <button
        data-mobile="search"
        class="mobile-nav-item"
      >
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>جستجو</span>
      </button>

      <button
        data-mobile="add"
        class="mobile-nav-item add"
      >
        <i class="fa-solid fa-plus"></i>
      </button>

      <button
        data-mobile="spaces"
        class="mobile-nav-item"
      >
        <i class="fa-solid fa-layer-group"></i>
        <span>Spaceها</span>
      </button>

      <button
        data-mobile="settings"
        class="mobile-nav-item"
      >
        <i class="fa-solid fa-sliders"></i>
        <span>تنظیمات</span>
      </button>

    </nav>


  </div>



  <!-- =========================
       CREATE BOX MODAL
  ========================== -->

  <div
    class="modal-overlay"
    id="boxModal"
    hidden
  >

    <div class="modal">

      <div class="modal-head">

        <div>
          <span class="modal-eyebrow">
            CREATE
          </span>

          <h2>ساختن باکس</h2>
        </div>

        <button
          class="close-modal"
          data-close-modal
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>


      <!-- Type -->

      <div class="type-grid">

        <button
          class="type-card selected"
          data-type="note"
        >
          <i class="fa-regular fa-note-sticky"></i>
          <strong>یادداشت</strong>
          <span>متن، لیست و جدول</span>
        </button>

        <button
          class="type-card"
          data-type="task"
        >
          <i class="fa-regular fa-square-check"></i>
          <strong>کار</strong>
          <span>کارهای قابل انجام</span>
        </button>

        <button
          class="type-card"
          data-type="link"
        >
          <i class="fa-solid fa-link"></i>
          <strong>لینک</strong>
          <span>ذخیره یک لینک</span>
        </button>

        <button
          class="type-card"
          data-type="folder"
        >
          <i class="fa-regular fa-folder"></i>
          <strong>پوشه</strong>
          <span>گروه‌بندی باکس‌ها</span>
        </button>

      </div>


      <!-- Dynamic form -->

      <form id="boxForm">

        <div id="formFields"></div>

        <div class="modal-actions">

          <button
            type="button"
            class="small-btn"
            data-close-modal
          >
            لغو
          </button>

          <button
            type="submit"
            class="small-btn primary"
          >
            <i class="fa-solid fa-check"></i>
            ساختن
          </button>

        </div>

      </form>

    </div>

  </div>



  <!-- =========================
       SPACE MODAL
  ========================== -->

  <div
    class="modal-overlay"
    id="spaceModal"
    hidden
  >

    <div class="modal small-modal">

      <div class="modal-head">

        <div>
          <span class="modal-eyebrow">
            NEW SPACE
          </span>

          <h2>Space جدید</h2>
        </div>

        <button
          class="close-modal"
          data-close-modal
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>


      <form id="spaceForm">

        <label class="field">

          <span>نام Space</span>

          <input
            id="spaceName"
            type="text"
            placeholder="مثلاً پروژه‌ها"
            maxlength="40"
            required
          >

        </label>


        <div class="modal-actions">

          <button
            type="button"
            class="small-btn"
            data-close-modal
          >
            لغو
          </button>

          <button
            type="submit"
            class="small-btn primary"
          >
            ساختن Space
          </button>

        </div>

      </form>

    </div>

  </div>



  <!-- =========================
       EDIT MODAL
  ========================== -->

  <div
    class="modal-overlay"
    id="editModal"
    hidden
  >

    <div class="modal">

      <div class="modal-head">

        <div>
          <span class="modal-eyebrow">
            EDIT
          </span>

          <h2>ویرایش باکس</h2>
        </div>

        <button
          class="close-modal"
          data-close-modal
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>


      <form id="editForm">

        <div id="editFields"></div>

        <div class="modal-actions">

          <button
            type="button"
            class="small-btn danger"
            id="deleteEditBtn"
          >
            <i class="fa-regular fa-trash-can"></i>
            حذف
          </button>

          <div class="modal-actions-right">

            <button
              type="button"
              class="small-btn"
              data-close-modal
            >
              لغو
            </button>

            <button
              type="submit"
              class="small-btn primary"
            >
              ذخیره تغییرات
            </button>

          </div>

        </div>

      </form>

    </div>

  </div>



  <!-- =========================
       TOAST
  ========================== -->

  <div
    class="toast"
    id="toast"
  >
    <i class="fa-solid fa-check"></i>
    <span></span>
  </div>



  <script src="script.js"></script>

</body>
</html>
