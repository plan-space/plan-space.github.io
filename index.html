<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b10">

  <title>Space Chi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

  <div class="brand">
    <span>Space Chi</span>
  </div>

  <div class="spaces-area">
    <div id="tabs" class="tabs"></div>

    <button
      id="addSpaceBtn"
      class="square-btn"
      title="New Space"
      aria-label="New Space"
    >
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>

  <div class="quick-actions">

    <button class="quick-btn" data-add="text" title="Add Text">
      <i class="fa-solid fa-font"></i>
      <span>Text</span>
    </button>

    <button class="quick-btn" data-add="parent" title="Add Folder">
      <i class="fa-solid fa-folder"></i>
      <span>Folder</span>
    </button>

    <button class="quick-btn" data-add="task" title="Add Task">
      <i class="fa-solid fa-list-check"></i>
      <span>Task</span>
    </button>

    <button class="quick-btn" data-add="link" title="Add Link">
      <i class="fa-solid fa-link"></i>
      <span>Link</span>
    </button>

    <button class="quick-btn" data-add="chart" title="Add Chart">
      <i class="fa-solid fa-chart-simple"></i>
      <span>Chart</span>
    </button>

    <span class="action-separator"></span>

    <button id="importBtn" class="square-btn" title="Import JSON">
      <i class="fa-solid fa-file-import"></i>
    </button>

    <button id="exportBtn" class="square-btn" title="Export JSON">
      <i class="fa-solid fa-file-export"></i>
    </button>

    <button id="themeBtn" class="square-btn" title="Toggle theme">
      <i class="fa-solid fa-sun"></i>
    </button>

    <button id="fullscreenBtn" class="square-btn" title="Fullscreen">
      <i class="fa-solid fa-expand"></i>
    </button>

  </div>

</header>


<main id="workspace">

  <section id="spaceViewport" class="space-viewport">

    <div id="canvas" class="canvas">

      <svg
        id="dotBackground"
        class="dot-background"
        aria-hidden="true"
      >
        <defs>
          <pattern
            id="dotPattern"
            width="24"
            height="24"
            patternUnits="userSpaceOnUse"
          >
            <circle
              cx="2"
              cy="2"
              r="1"
              class="dot"
            />
          </pattern>
        </defs>

        <rect
          width="100%"
          height="100%"
          fill="url(#dotPattern)"
        />
      </svg>

      <svg
        id="connections"
        class="connections"
        aria-hidden="true"
      ></svg>

      <div id="boxesLayer" class="boxes-layer"></div>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">
          <i class="fa-regular fa-square"></i>
        </div>

        <h2>Your space is empty</h2>
        <p>Add a box to start building your space.</p>
      </div>

    </div>

  </section>

</main>


<nav class="mobile-toolbar">

  <button data-add="text">
    <i class="fa-solid fa-font"></i>
    <span>Text</span>
  </button>

  <button data-add="parent">
    <i class="fa-solid fa-folder"></i>
    <span>Folder</span>
  </button>

  <button data-add="task">
    <i class="fa-solid fa-list-check"></i>
    <span>Task</span>
  </button>

  <button data-add="link">
    <i class="fa-solid fa-link"></i>
    <span>Link</span>
  </button>

  <button data-add="chart">
    <i class="fa-solid fa-chart-simple"></i>
    <span>Chart</span>
  </button>

</nav>


<input
  id="fileInput"
  type="file"
  accept="application/json,.json"
  hidden
>


<div id="modalRoot" class="modal-root" hidden></div>

<div id="toast" class="toast"></div>


<script src="script.js" defer></script>

</body>
</html>
