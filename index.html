<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chi Space</title>

  <meta name="theme-color" content="#0a0a0b">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP -->
  <header class="topbar">

    <div class="brand">
      <img
        src="https://cdn.imgurl.ir/uploads/j9346_InShot_20260930_141619549.png"
        alt="Chi Space"
      >
    </div>

    <div class="spaces-area">
      <div id="tabs" class="tabs"></div>

      <button
        id="addSpaceBtn"
        class="square-btn"
        title="New Space"
      >
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>

    <div class="quick-actions">

      <button class="quick-btn" data-type="text" title="Text">
        <i class="fa-solid fa-align-left"></i>
      </button>

      <button class="quick-btn" data-type="folder" title="Folder">
        <i class="fa-solid fa-folder"></i>
      </button>

      <button class="quick-btn" data-type="note" title="Note">
        <i class="fa-solid fa-note-sticky"></i>
      </button>

      <button class="quick-btn" data-type="task" title="Task">
        <i class="fa-solid fa-list-check"></i>
      </button>

      <button class="quick-btn" data-type="link" title="Link">
        <i class="fa-solid fa-link"></i>
      </button>

    </div>

  </header>


  <!-- MAIN -->
  <main id="workspace"></main>


  <!-- MOBILE TOOLBAR -->
  <nav class="mobile-toolbar">

    <button id="mobileSpaceBtn">
      <i class="fa-solid fa-plus"></i>
      <span>Space</span>
    </button>

    <button data-mobile-type="text">
      <i class="fa-solid fa-align-left"></i>
      <span>Text</span>
    </button>

    <button data-mobile-type="folder">
      <i class="fa-solid fa-folder"></i>
      <span>Folder</span>
    </button>

    <button data-mobile-type="note">
      <i class="fa-solid fa-note-sticky"></i>
      <span>Note</span>
    </button>

    <button data-mobile-type="task">
      <i class="fa-solid fa-list-check"></i>
      <span>Task</span>
    </button>

    <button data-mobile-type="link">
      <i class="fa-solid fa-link"></i>
      <span>Link</span>
    </button>

  </nav>


  <!-- TOAST -->
  <div id="toast"></div>


  <!-- CONFIRM -->
  <div id="confirmModal" class="modal hidden">

    <div class="modal-card">

      <div class="modal-icon">
        <i class="fa-solid fa-trash"></i>
      </div>

      <h3 id="confirmTitle">Delete?</h3>

      <p id="confirmText"></p>

      <div class="modal-actions">
        <button id="cancelConfirm" class="btn secondary">
          Cancel
        </button>

        <button id="acceptConfirm" class="btn danger">
          Delete
        </button>
      </div>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
