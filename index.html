<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090a">

  <title>Space Chi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

  <div class="brand">
    <div class="brand-mark">
      <i class="fa-solid fa-layer-group"></i>
    </div>

    <div class="brand-name">
      Space Chi
    </div>
  </div>

  <div class="spaces-area">
    <div id="tabs" class="tabs"></div>

    <button
      class="square-btn"
      id="addSpaceBtn"
      title="New Space"
      aria-label="New Space"
    >
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>

  <div class="quick-actions">

    <button class="quick-btn" data-add="text" title="Add Text">
      <i class="fa-solid fa-font"></i>
      <span>Text</span>
    </button>

    <button class="quick-btn" data-add="parent" title="Add Folder">
      <i class="fa-regular fa-folder"></i>
      <span>Folder</span>
    </button>

    <button class="quick-btn" data-add="task" title="Add Task">
      <i class="fa-solid fa-list-check"></i>
      <span>Task</span>
    </button>

    <button class="quick-btn" data-add="link" title="Add Link">
      <i class="fa-solid fa-link"></i>
      <span>Link</span>
    </button>

    <button class="quick-btn" id="importBtn" title="Import JSON">
      <i class="fa-solid fa-file-import"></i>
    </button>

    <button class="quick-btn" id="exportBtn" title="Export JSON">
      <i class="fa-solid fa-file-export"></i>
    </button>

    <button class="quick-btn" id="fullscreenBtn" title="Fullscreen">
      <i class="fa-solid fa-expand"></i>
    </button>

    <button class="quick-btn" id="themeBtn" title="Light / Dark">
      <i class="fa-solid fa-sun"></i>
    </button>

  </div>
</header>


<main id="workspace">

  <section class="space" id="activeSpace">

    <div class="canvas" id="canvas">

      <div class="canvas-inner" id="canvasInner">

        <svg
          class="connections"
          id="connections"
          xmlns="http://www.w3.org/2000/svg"
        ></svg>

        <div class="empty" id="emptyState">
          <div class="empty-icon">
            <i class="fa-solid fa-cubes"></i>
          </div>

          <h2>Your space is empty</h2>
          <p>Add a text, folder, task or link to start.</p>

          <button class="btn primary" data-add="text">
            <i class="fa-solid fa-plus"></i>
            Add Text
          </button>
        </div>

        <div id="boxes"></div>

      </div>
    </div>

  </section>

</main>


<div class="mobile-toolbar">

  <button data-add="text">
    <i class="fa-solid fa-font"></i>
    <span>Text</span>
  </button>

  <button data-add="parent">
    <i class="fa-regular fa-folder"></i>
    <span>Folder</span>
  </button>

  <button data-add="task">
    <i class="fa-solid fa-list-check"></i>
    <span>Task</span>
  </button>

  <button data-add="link">
    <i class="fa-solid fa-link"></i>
    <span>Link</span>
  </button>

  <button id="mobileMoreBtn">
    <i class="fa-solid fa-ellipsis"></i>
    <span>More</span>
  </button>

</div>


<input
  type="file"
  id="importInput"
  accept="application/json,.json"
  hidden
>


<div id="modalRoot"></div>

<div id="toast"></div>


<script src="script.js" defer></script>

</body>
</html>
