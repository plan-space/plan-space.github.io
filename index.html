<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Chi</title>
  <link rel="icon" href="https://cdn.imgurl.ir/uploads/j9346_InShot_20260930_141619549.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="chrome">
    <a id="brand" href="#" title="Space Chi">
      <img src="https://cdn.imgurl.ir/uploads/j9346_InShot_20260930_141619549.png" alt="Space Chi" />
      <span>space chi</span>
    </a>

    <div id="tabs" role="tablist"></div>

    <button class="icon-btn" id="add-space-btn" title="اسپیس جدید">
      <i class="fa-solid fa-plus"></i>
    </button>

    <nav id="desk-nav" class="desk-only">
      <button class="nav-btn" data-action="add-box" title="باکس جدید"><i class="fa-solid fa-square-plus"></i><span>باکس</span></button>
      <button class="nav-btn" data-action="search" title="جستجو"><i class="fa-solid fa-magnifying-glass"></i><span>جستجو</span></button>
      <button class="nav-btn" data-action="export" title="خروجی"><i class="fa-solid fa-download"></i><span>خروجی</span></button>
      <button class="nav-btn" data-action="import" title="ورودی"><i class="fa-solid fa-upload"></i><span>ورودی</span></button>
      <button class="nav-btn" data-action="theme" title="تم"><i class="fa-solid fa-circle-half-stroke"></i><span>تم</span></button>
    </nav>
  </header>

  <div id="crumb">
    <button id="back-folder" class="ghost" hidden><i class="fa-solid fa-arrow-right"></i> برگشت</button>
    <div id="path"></div>
    <div id="space-meta"></div>
  </div>

  <main id="board"></main>

  <nav id="mob-nav" class="mob-only">
    <button data-action="spaces"><i class="fa-solid fa-layer-group"></i><span>اسپیس</span></button>
    <button data-action="add-box"><i class="fa-solid fa-plus"></i><span>باکس</span></button>
    <button data-action="search"><i class="fa-solid fa-magnifying-glass"></i><span>جستجو</span></button>
    <button data-action="more"><i class="fa-solid fa-ellipsis"></i><span>بیشتر</span></button>
  </nav>

  <div id="modal" class="hidden" role="dialog">
    <div class="sheet">
      <div class="sheet-head">
        <h3 id="modal-title">باکس جدید</h3>
        <button class="icon-btn" id="modal-close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <input type="file" id="import-file" accept="application/json" hidden />
  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
